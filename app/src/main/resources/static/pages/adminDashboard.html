<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Clinic Management</title>
  <link rel="icon" href="../assets/images/favicon.ico" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
</head>
<body>

  <div class="container">
    <div class="wrapper">

      <!-- Dynamic Header -->
      <div id="header"></div>

      <!-- Main Content -->
      <main class="dashboard-main">

        <!-- Controls bar -->
        <div class="controls-bar">
          <input type="text" id="searchBar" class="search-input" placeholder="Search doctors by name…" />

          <select id="filterTime" class="filter-select">
            <option value="">All Times</option>
            <option value="AM">Morning (AM)</option>
            <option value="PM">Afternoon (PM)</option>
          </select>

          <select id="filterSpecialty" class="filter-select">
            <option value="">All Specialties</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Neurology">Neurology</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="General">General</option>
          </select>

          <button id="addDocBtn" class="btn-primary">+ Add Doctor</button>
        </div>

        <!-- Doctor Cards Grid -->
        <div id="content" class="cards-grid">
          <p class="loading-text">Loading doctors…</p>
        </div>
      </main>

      <!-- Dynamic Footer -->
      <div id="footer"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <span id="closeModal" class="close">&times;</span>
    <div id="modal-body"></div>
  </div>

  <!-- Entry point -->
  <script type="module" src="../js/adminDashboard.js"></script>

</body>
</html>
